spring.application.name=medical-quality
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:medical_quality}
spring.datasource.username=${MYSQL_USER:medical}
spring.datasource.password=${MYSQL_PASSWORD:medical}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.admin.username=${SUPER_ADMIN_USERNAME}
app.admin.password=${SUPER_ADMIN_PASSWORD}
