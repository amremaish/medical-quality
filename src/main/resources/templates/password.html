<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a password</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <section class="panel form-card">
        <h1>Choose a password</h1>
        <p>Your invitation used a temporary password. Set one only you know before continuing.</p>
        <form id="password-form" class="stack">
          <div><label for="current-password">Current password</label><input id="current-password" type="password" required></div>
          <div><label for="new-password">New password</label><input id="new-password" type="password" required minlength="8"></div>
          <p class="err" id="form-error"></p>
          <button type="submit">Save password</button>
        </form>
      </section>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  $("#password-form").on("submit", function (event) {
    event.preventDefault();
    api("POST", "/api/auth/password", {
      currentPassword: $("#current-password").val(),
      newPassword: $("#new-password").val()
    }).done(function () {
      window.location.href = "/";
    }).fail(function (xhr) {
      $("#form-error").text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : "Could not update the password");
    });
  });
</script>
</body>
</html>
