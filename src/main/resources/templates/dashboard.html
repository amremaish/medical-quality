<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div class="app-shell">
    <aside th:replace="~{fragments/shell :: sidebar}"></aside>
    <div class="workspace">
      <header th:replace="~{fragments/shell :: topbar}"></header>
      <main class="page" id="board" th:attr="data-title=${title}">
        <header class="page-head">
          <div>
            <p class="quiet-text" id="board-scope">All audits on record.</p>
          </div>
        </header>
        <section class="attention-board" aria-labelledby="attention-heading">
          <h2 id="attention-heading">Needs attention</h2>
          <p class="quiet-text attention-rule" id="attention-definition">Audits past their date or due today, CAPAs past their target date, findings with no CAPA, and findings open more than 30 days.</p>
          <div class="pills" id="attention-pills"></div>
          <div class="table-card">
            <table class="data-table" aria-labelledby="attention-heading">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Department</th>
                  <th>Owner</th>
                  <th>Age</th>
                </tr>
              </thead>
              <tbody id="attention-rows"></tbody>
            </table>
          </div>
          <p class="quiet-text attention-more" id="attention-more" hidden></p>
        </section>
        <div class="split">
          <div class="chart-card" id="compliance"></div>
          <div class="chart-card" id="by-department"></div>
        </div>
        <p class="totals" id="totals"></p>
        <p class="err" id="err"></p>
      </main>
    </div>
  </div>
  <script th:src="@{/js/jquery.min.js}"></script>
  <script th:src="@{/js/api.js}"></script>
  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
