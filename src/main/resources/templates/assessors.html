<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessors</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <div class="page-head">
        <div><h1>Assessors</h1><p id="assessor-count">People assigned to score departments.</p></div>
      </div>
      <div class="table-card"><table class="data-table"><thead><tr><th>Person</th><th>Arabic</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      <p class="err" id="list-error"></p>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }
  function fail(xhr) {
    const message = xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : "Could not load assessors";
    $("#list-error").text(message);
  }
  api("GET", "/api/auth/me").done(function (me) {
    const canEdit = directoryAdmin(me.data) || holds(me.data, "MANAGE_ASSESSORS");
    api("GET", "/api/assessors").done(function (res) {
      const count = res.data.length;
      $("#assessor-count").text(count === 1 ? "1 person assigned to score departments." : count + " people assigned to score departments.");
      $("#rows").html(res.data.map(function (row) {
        const name = row.nameEn || row.code;
        const initial = String(name || "?").slice(0, 1).toUpperCase();
        const status = row.active ? "Active" : "Inactive";
        const action = canEdit
          ? "<a class='btn ghost sm' href='/assessors/" + row.id + "'>Edit</a>"
          : "";
        return "<tr><td><div class='person'><span class='avatar sm'>" + esc(initial) + "</span><div><strong>" +
          esc(name) + "</strong><small>" + esc(row.code) + "</small></div></div></td><td>" + esc(row.nameAr) +
          "</td><td><span class='status " + (row.active ? "ok" : "off") + "'>" + status +
          "</span></td><td class='actions'>" + action + "</td></tr>";
      }).join("") || "<tr><td colspan='4' class='empty'>No assessors</td></tr>");
    }).fail(fail);
  });
</script>
</body>
</html>
