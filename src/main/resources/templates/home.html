<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical quality</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div class="app-shell">
    <aside th:replace="~{fragments/shell :: sidebar}"></aside>
    <div class="workspace">
      <header th:replace="~{fragments/shell :: topbar}"></header>
      <main class="page">
        <section class="hero">
          <div>
            <p>Good morning</p>
            <h1 id="who">Quality workspace</h1>
            <p id="org-line">Quality platform for hospitals</p>
          </div>
          <div class="hero-art">
            <span><svg th:replace="~{fragments/shell :: i('stethoscope')}"></svg></span>
            <span><svg th:replace="~{fragments/shell :: i('clipboard')}"></svg></span>
            <span><svg th:replace="~{fragments/shell :: i('file')}"></svg></span>
          </div>
        </section>
        <div class="kpis">
          <a class="kpi" href="/audits"><span class="disc blue"><svg th:replace="~{fragments/shell :: i('clipboard')}"></svg></span><div><b>GSR</b><span>29 standards, half-credit score</span></div></a>
          <a class="kpi" href="/record-reviews"><span class="disc green"><svg th:replace="~{fragments/shell :: i('file')}"></svg></span><div><b>Records</b><span>10 files, legible, accurate, complete</span></div></a>
          <a class="kpi" href="/dashboard"><span class="disc orange"><svg th:replace="~{fragments/shell :: i('chart')}"></svg></span><div><b>Dashboard</b><span>Compliance and open work</span></div></a>
        </div>
      </main>
    </div>
  </div>
  <script th:src="@{/js/jquery.min.js}"></script>
  <script th:src="@{/js/api.js}"></script>
</body>
</html>
