<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script th:src="@{/js/i18n.js}"></script>
  <title data-i18n="page.uploadTitle">Upload evidence</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <a class="back" href="/evidence" data-i18n="page.evidence">Evidence</a>
      <section class="panel form-card">
        <h1 data-i18n="page.uploadTitle">Upload evidence</h1>
        <p data-i18n="page.uploadLead">Attach a file to an audit in this hospital.</p>
        <form id="upload" class="stack">
          <div><label for="file" data-i18n="field.file">File</label><input id="file" type="file" required></div>
          <div><label for="auditId" data-i18n="field.auditId">Audit id</label><input id="auditId" required inputmode="numeric"></div>
          <p class="err" id="form-error"></p>
          <div class="form-actions">
            <a class="btn ghost" href="/evidence" data-i18n="action.cancel">Cancel</a>
            <button type="submit" data-i18n="action.upload">Upload</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  $("#upload").on("submit", function (event) {
    event.preventDefault();
    const data = new FormData();
    data.append("file", $("#file")[0].files[0]);
    data.append("auditId", $("#auditId").val());
    $.ajax({
      url: "/api/evidence",
      method: "POST",
      data: data,
      processData: false,
      contentType: false,
      headers: authHeaders()
    }).done(function () {
      window.location.href = "/evidence";
    }).fail(function (xhr) {
      $("#form-error").text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : mqText("Upload failed", "تعذر الرفع"));
    });
  });
</script>
</body>
</html>
