<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload evidence</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <a class="back" href="/evidence">Evidence</a>
      <section class="panel form-card">
        <h1>Upload evidence</h1>
        <p>Attach a file to an audit, or leave the audit blank.</p>
        <form id="upload" class="stack">
          <div><label for="file">File</label><input id="file" type="file" required></div>
          <div><label for="auditId">Audit id</label><input id="auditId" placeholder="Optional"></div>
          <p class="err" id="form-error"></p>
          <div class="form-actions">
            <a class="btn ghost" href="/evidence">Cancel</a>
            <button type="submit">Upload</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  $("#upload").on("submit", function (event) {
    event.preventDefault();
    const data = new FormData();
    data.append("file", $("#file")[0].files[0]);
    if ($("#auditId").val()) data.append("auditId", $("#auditId").val());
    $.ajax({
      url: "/api/evidence",
      method: "POST",
      data: data,
      processData: false,
      contentType: false,
      headers: { Authorization: "Bearer " + sessionStorage.getItem("mq_token") }
    }).done(function () {
      window.location.href = "/evidence";
    }).fail(function (xhr) {
      $("#form-error").text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : "Upload failed");
    });
  });
</script>
</body>
</html>
