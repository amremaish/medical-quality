<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script th:src="@{/js/i18n.js}"></script>
  <title data-i18n="page.roleNew">New role</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <a class="back" href="/roles" data-i18n="page.roles">Roles</a>
      <section class="panel form-card">
        <h1 data-i18n="page.roleNew">New role</h1>
        <p data-i18n="page.roleLead">A custom role can receive only the permissions you already hold, and only ones this hospital can assign.</p>
        <form id="create-role" class="stack">
          <div><label for="name" data-i18n="field.orgName">Name</label><input id="name" required maxlength="100"></div>
          <div><label for="scope" data-i18n="field.scope">What this role can see</label>
            <select id="scope" required>
              <option value="HOSPITAL" data-i18n="scope.hospital">Whole hospital</option>
              <option value="ASSESSOR" data-i18n="scope.assessor">Own assessments</option>
              <option value="DEPARTMENT" data-i18n="scope.department">One department</option>
              <option value="DEPARTMENT_LIST" data-i18n="scope.list">Assigned departments</option>
            </select>
          </div>
          <div><label data-i18n="field.permissions">Permissions</label><div id="permissions" class="stack"></div></div>
          <p class="err" id="form-error"></p>
          <div class="form-actions">
            <a class="btn ghost" href="/roles" data-i18n="action.cancel">Cancel</a>
            <button type="submit" data-i18n="action.saveRole">Save role</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  const permissions = [
    ["CONDUCT_AUDIT", "Conduct audits"],
    ["MANAGE_FINDINGS", "Manage findings"],
    ["MANAGE_CAPA", "Manage CAPA"],
    ["MANAGE_EVIDENCE", "Manage evidence"],
    ["VIEW_COMMAND_CENTER", "Command center"],
    ["VIEW_EXECUTIVE_DASHBOARD", "Executive dashboard"],
    ["VIEW_ASSESSOR_DASHBOARD", "Assessor dashboard"],
    ["VIEW_QUALITY_DIRECTOR_DASHBOARD", "Quality director dashboard"],
    ["MANAGE_IMPORT", "Import PDFs"],
    ["ARCHIVE_AUDIT", "Archive audits"],
    ["EDIT_AUDIT_LIFECYCLE", "Edit audit lifecycle"],
    ["DELETE_AUDIT_PDF", "Delete an audit PDF"],
    ["DELETE_AUDIT_ONLY", "Delete an audit"],
    ["DELETE_AUDIT_EVERYTHING", "Delete an audit and related records"]
  ];
  let allowOverrides = false;
  function paintPermissions() {
    const selected = {};
    $("#permissions input:checked").each(function () { selected[this.value] = true; });
    const rows = permissions.slice();
    if (allowOverrides) rows.push(["MANAGE_USER_PERMISSION_OVERRIDES", "Manage exceptional permissions"]);
    $("#permissions").html(rows.map(function (row) {
      const on = selected[row[0]] ? " checked" : "";
      return "<label><input type='checkbox' value='" + row[0] + "'" + on + "> " + mqPerm(row[0], row[1]) + "</label>";
    }).join(""));
  }
  document.addEventListener("mq-lang", paintPermissions);
  paintPermissions();
  api("GET", "/api/auth/me").done(function (me) {
    if (me.data && me.data.superAdmin) {
      allowOverrides = true;
      paintPermissions();
    }
    const orgId = actingOrganizationId(me.data);
    $("#create-role").on("submit", function (event) {
      event.preventDefault();
      $("#form-error").text("");
      if (!orgId) {
        $("#form-error").text(mqText("Open a hospital first", "افتح مستشفى أولاً"));
        return;
      }
      const selected = $("#permissions input:checked").map(function () { return this.value; }).get();
      api("POST", "/api/organizations/" + orgId + "/roles", {
        name: $("#name").val(),
        scopeMode: $("#scope").val(),
        permissions: selected
      }).done(function () {
        window.location.href = "/roles";
      }).fail(function (xhr) {
        $("#form-error").text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : mqText("Could not save the role", "تعذر حفظ الدور"));
      });
    });
  });
</script>
</body>
</html>
