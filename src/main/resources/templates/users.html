<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script th:src="@{/js/i18n.js}"></script>
  <title data-i18n="page.users">Users</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <div class="page-head">
        <div><h1 data-i18n="page.users">Users</h1><p id="user-count" data-i18n="page.usersLead">People who can sign in to this hospital.</p></div>
        <a class="btn" id="invite-user" href="/users/new" hidden><svg th:replace="~{fragments/shell :: i('plus')}"></svg><span data-i18n="action.inviteUser">Invite user</span></a>
      </div>
      <div class="table-card"><table class="data-table"><thead><tr><th data-i18n="col.person">Person</th><th data-i18n="col.role">Role</th><th data-i18n="col.status">Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      <p class="err" id="list-error"></p>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }
  function statusClass(status) {
    return status === "Active" ? "ok" : "off";
  }
  let userRows = null;
  let userCanEdit = false;
  let userMissingOrg = false;
  function fail(xhr) {
    const message = xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : mqText("Could not load users", "تعذر تحميل المستخدمين");
    $("#list-error").text(message);
  }
  function paintUsers() {
    if (userMissingOrg) {
      $("#rows").html("<tr><td colspan='4' class='empty'>" + esc(mqText("Open a hospital first", "افتح مستشفى أولاً")) + "</td></tr>");
      return;
    }
    if (!userRows) return;
    const count = userRows.length;
    const label = userCanEdit ? mqText("Edit", "تعديل") : mqText("Exceptional permissions", "صلاحيات استثنائية");
    $("#user-count").text(count === 1
      ? mqText("1 person in this hospital.", "شخص واحد في هذا المستشفى.")
      : mqText(count + " people in this hospital.", count + " أشخاص في هذا المستشفى."));
    $("#rows").html(userRows.map(function (row) {
      const name = ((row.firstName || "") + (row.lastName ? " " + row.lastName : "")).trim() || row.email;
      const initial = name.slice(0, 1).toUpperCase();
      return "<tr><td><div class='person'><span class='avatar sm'>" + esc(initial) + "</span><div><strong>" +
        esc(name) + "</strong><small>" + esc(row.email) + "</small></div></div></td><td><span class='pill'>" +
        esc(mqRole(row.roleCode, row.roleName)) + "</span></td><td><span class='status " + statusClass(row.status) + "'>" +
        esc(mqStatus(row.status)) + "</span></td><td class='actions'><a class='btn ghost sm' href='/users/" +
        row.id + "'>" + esc(label) + "</a></td></tr>";
    }).join("") || "<tr><td colspan='4' class='empty'>" + esc(mqText("No users yet", "لا يوجد مستخدمون بعد")) + "</td></tr>");
  }
  document.addEventListener("mq-lang", paintUsers);
  api("GET", "/api/auth/me").done(function (me) {
    const viewer = me.data;
    const orgId = actingOrganizationId(viewer);
    userCanEdit = directoryAdmin(viewer);
    $("#invite-user").prop("hidden", !userCanEdit);
    if (!orgId) {
      userMissingOrg = true;
      paintUsers();
      return;
    }
    api("GET", "/api/organizations/" + orgId + "/users").done(function (res) {
      userRows = res.data || [];
      paintUsers();
    }).fail(fail);
  });
</script>
</body>
</html>
