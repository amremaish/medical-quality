<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSR audits</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div class="app-shell">
    <aside th:replace="~{fragments/shell :: sidebar}"></aside>
    <div class="workspace">
      <header th:replace="~{fragments/shell :: topbar}"></header>
      <main class="page">
        <div class="page-head">
          <div>
            <h1>GSR audits</h1>
            <p>Standards scored with half credit. Open an audit to mark elements.</p>
          </div>
          <a class="btn" href="/audits/new" data-perm="CONDUCT_AUDIT" hidden><svg th:replace="~{fragments/shell :: i('plus')}"></svg>New audit</a>
        </div>
        <p class="quiet-text" id="audit-filter" hidden></p>
        <div class="table-card">
          <table class="data-table">
            <thead><tr><th>Date</th><th>Department</th><th>Auditor</th><th>Status</th><th>Compliance</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script th:src="@{/js/jquery.min.js}"></script>
  <script th:src="@{/js/api.js}"></script>
  <script th:src="@{/js/audits.js}"></script>
</body>
</html>
