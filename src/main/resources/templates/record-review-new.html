<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New record review</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <a class="back" href="/record-reviews">Medical records</a>
      <section class="panel form-card">
        <h1>New record review</h1>
        <p>Start a review for one hospital, reviewer, and ward.</p>
        <form id="create-review" class="stack">
          <div><label for="hospitalName">Hospital</label><input id="hospitalName" required></div>
          <div><label for="reviewerName">Reviewer</label><input id="reviewerName" required></div>
          <div><label for="reviewDate">Date</label><input id="reviewDate" type="date" required></div>
          <div><label for="departmentName">Department / ward</label><input id="departmentName" required></div>
          <p class="err" id="form-error"></p>
          <div class="form-actions">
            <a class="btn ghost" href="/record-reviews">Cancel</a>
            <button type="submit">Create review</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  $("#reviewDate").val(new Date().toISOString().slice(0, 10));
  $("#create-review").on("submit", function (event) {
    event.preventDefault();
    api("POST", "/api/record-reviews", {
      hospitalName: $("#hospitalName").val(),
      reviewerName: $("#reviewerName").val(),
      reviewDate: $("#reviewDate").val(),
      departmentName: $("#departmentName").val()
    }).done(function (res) {
      window.location.href = "/record-reviews/" + res.data.id;
    }).fail(function (xhr) {
      $("#form-error").text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : "Could not create review");
    });
  });
</script>
</body>
</html>
