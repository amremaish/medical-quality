<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script th:src="@{/js/i18n.js}"></script>
  <title data-i18n="page.owners">Owners</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <div class="page-head">
        <div>
          <h1 data-i18n="page.owners">Owners</h1>
          <p data-i18n="page.ownersLead">People invited to run an organization. Invited owners still need to choose a password.</p>
        </div>
        <a class="btn" href="/owners/new"><svg th:replace="~{fragments/shell :: i('plus')}"></svg><span data-i18n="action.inviteOwner">Invite owner</span></a>
      </div>
      <p class="err" id="form-error"></p>
      <div class="table-card">
        <table class="data-table">
          <thead><tr><th data-i18n="col.owner">Owner</th><th data-i18n="col.email">Email</th><th data-i18n="col.organization">Organization</th><th data-i18n="col.status">Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }
  let ownerRows = null;
  function paintOwners() {
    if (!ownerRows) return;
    $("#rows").html(ownerRows.map(function (row) {
      const statusClass = row.status === "Active" ? "ok" : "off";
      return "<tr><td>" + esc(row.name) + "</td><td>" + esc(row.email) + "</td><td>" + esc(row.organizationName) +
        "</td><td><span class='status " + statusClass + "'>" + esc(mqStatus(row.status)) + "</span></td></tr>";
    }).join("") || "<tr><td colspan='4' class='empty'>" + esc(mqText("No owners invited yet", "لم تُرسل دعوات للملاك بعد")) + "</td></tr>");
  }
  document.addEventListener("mq-lang", paintOwners);
  api("GET", "/api/owners").done(function (res) {
    ownerRows = res.data || [];
    paintOwners();
  }).fail(function (xhr) {
    $("#form-error").text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : mqText("Owners are limited to the platform super admin", "الملاك متاحون لمدير المنصة فقط"));
  });
</script>
</body>
</html>
