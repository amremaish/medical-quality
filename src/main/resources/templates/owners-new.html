<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script th:src="@{/js/i18n.js}"></script>
  <title data-i18n="page.ownerNew">Invite owner</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <a class="back" href="/owners" data-i18n="page.owners">Owners</a>
      <section class="panel form-card">
        <h1 data-i18n="page.ownerNew">Invite owner</h1>
        <p data-i18n="page.ownerLead">The owner signs in with this email and must replace the temporary password.</p>
        <form id="invite-owner" class="stack">
          <div><label for="owner-org" data-i18n="field.orgName">Organization</label><select id="owner-org" required></select></div>
          <div><label for="owner-first" data-i18n="field.first">First name</label><input id="owner-first" required maxlength="128"></div>
          <div><label for="owner-last" data-i18n="field.last">Last name</label><input id="owner-last" maxlength="128"></div>
          <div><label for="owner-email" data-i18n="field.email">Email</label><input id="owner-email" type="email" required maxlength="320"></div>
          <p class="err" id="form-error"></p>
          <div class="form-actions">
            <a class="btn ghost" href="/owners" data-i18n="action.cancel">Cancel</a>
            <button type="submit" data-i18n="action.sendInvite">Send invitation</button>
          </div>
        </form>
        <section id="invite" hidden>
          <h2 data-i18n="invite.title">Owner invitation</h2>
          <p id="invite-text"></p>
          <p><strong data-i18n="field.email">Email</strong> <span id="invite-email"></span></p>
          <div class="url-line"><code id="invite-url"></code></div>
          <button type="button" id="copy-invite" class="ghost" data-i18n="action.copyInvite">Copy invitation</button>
        </section>
      </section>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }
  document.addEventListener("mq-lang", function () {
    const org = $("#invite-text").data("org");
    if (org) $("#invite-text").text(mqText(org + " owner is invited. Send this one-time setup link.", "دُعي مالك " + org + ". أرسل رابط الإعداد لمرة واحدة."));
  });
  api("GET", "/api/organizations").done(function (res) {
    $("#owner-org").html(res.data.map(function (row) {
      return "<option value='" + row.id + "'>" + esc(row.name) + "</option>";
    }).join("") || "<option value=''>" + esc(mqText("Create an organization first", "أنشئ مؤسسة أولاً")) + "</option>");
  });
  $("#invite-owner").on("submit", function (event) {
    event.preventDefault();
    $("#form-error").text("");
    api("POST", "/api/owners", {
      organizationId: Number($("#owner-org").val()),
      ownerFirstName: $("#owner-first").val(),
      ownerLastName: $("#owner-last").val(),
      ownerEmail: $("#owner-email").val()
    }).done(function (res) {
      const invite = res.data;
      $("#invite-text").data("org", invite.organizationName).text(mqText(invite.organizationName + " owner is invited. Send this one-time setup link.", "دُعي مالك " + invite.organizationName + ". أرسل رابط الإعداد لمرة واحدة."));
      $("#invite-email").text(invite.ownerEmail);
      $("#invite-url").text(invite.setupUrl);
      $("#invite").prop("hidden", false);
      $("#invite-owner").hide();
    }).fail(function (xhr) {
      $("#form-error").text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : mqText("Could not invite the owner", "تعذرت دعوة المالك"));
    });
  });
  $("#copy-invite").on("click", function () {
    const text = mqText("Email: ", "البريد: ") + $("#invite-email").text() + "\n" + mqText("Open this link to choose a password:", "افتح هذا الرابط لاختيار كلمة المرور:") + "\n" + $("#invite-url").text();
    navigator.clipboard.writeText(text);
  });
</script>
</body>
</html>
