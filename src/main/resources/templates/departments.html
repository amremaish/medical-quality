<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Departments</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/shell :: sidebar}"></aside>
  <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar}"></header>
    <main class="page">
      <div class="page-head">
        <div><h1>Departments</h1><p>Clinical areas this hospital works with. Each hospital keeps its own list.</p></div>
        <a class="btn" id="new-department" href="/departments/new" hidden><svg th:replace="~{fragments/shell :: i('plus')}"></svg>New department</a>
      </div>
      <div class="table-card"><table class="data-table"><thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Head</th><th>Assessor</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
    </main>
  </div>
</div>
<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }
  api("GET", "/api/auth/me").done(function (res) {
    if (res.data.superAdmin || res.data.roleCode === "HOSPITAL_OWNER") $("#new-department").prop("hidden", false);
  });
  api("GET", "/api/departments").done(function (res) {
    $("#rows").html(res.data.map(function (row) {
      return "<tr><td>" + esc(row.code) + "</td><td>" + esc(row.nameAr) + "</td><td><span class='pill'>" + esc(row.deptType) + "</span></td><td>" +
        esc(row.headName) + "</td><td>" + esc(row.assessorName) + "</td><td>" + esc(row.status) + "</td></tr>";
    }).join("") || "<tr><td colspan='6' class='empty'>This hospital has no departments yet</td></tr>");
  }).fail(function (xhr) {
    const message = xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : "Could not load departments";
    $("#rows").html("<tr><td colspan='6' class='empty'>" + esc(message) + "</td></tr>");
  });
</script>
</body>
</html>
